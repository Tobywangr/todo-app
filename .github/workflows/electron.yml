name: Electron desktop build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: Test and build Ubuntu package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Electron regression tests
        run: xvfb-run --auto-servernum npm test

      - name: Build Ubuntu .deb
        run: npm run build:linux

      - name: Upload Ubuntu package
        uses: actions/upload-artifact@v4
        with:
          name: shiguang-todo-ubuntu-deb
          path: dist/*.deb
          if-no-files-found: error

  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows NSIS installer
        run: npm run build:windows

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: shiguang-todo-windows-installer
          path: dist/*Windows-x64-Setup.exe
          if-no-files-found: error
